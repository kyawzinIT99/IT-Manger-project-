# ============================================================
# 03-secret.yaml — Sensitive Passwords & Keys
# ============================================================
# WHAT IS A KUBERNETES SECRET?
#   Just like ConfigMap, EXCEPT it is meant for sensitive data:
#   database passwords, JWT signing keys, and API tokens.
#
#   Kubernetes mounts or injects these into the container memory
#   at runtime so they are NEVER hardcoded inside your Dockerfile.
#
# NOTE:
#   `stringData` lets you write plain text in YAML, and Kubernetes
#   automatically base64-encodes it when storing it in the cluster.
#   (In production, sync this with Google Secret Manager or never
#   commit real passwords to Git!)
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: storefront-secrets         # Name referenced in 04-deployment.yaml
  namespace: northpoint-living
type: Opaque                       # Standard key-value secret type
stringData:
  # Database password (must match var.db_password in Terraform)
  DB_PASSWORD: "CHANGE_ME_to_a_str0ng_passw0rd!"

  # JWT secret used to sign customer login tokens
  JWT_SECRET: "super-secret-jwt-signing-key-32-chars-min"

  # Application encryption secret (sessions / CSRF)
  APP_SECRET: "northpoint-living-app-encryption-secret-key-2026"

  # ---- ADMIN & USER LOGIN CREDENTIALS (To Control the App) ----
  # Injected into the Pod as process.env.ADMIN_USERNAME / process.env.ADMIN_PASSWORD
  ADMIN_USERNAME: "admin@northpointliving.com"
  ADMIN_PASSWORD: "Admin@Northpoint2026!"

  # Default Customer / Staff User Account
  USER_USERNAME: "staff@northpointliving.com"
  USER_PASSWORD: "Staff@Northpoint2026!"

