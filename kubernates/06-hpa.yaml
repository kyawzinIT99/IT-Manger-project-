# ============================================================
# 06-hpa.yaml — Horizontal Pod Autoscaler (10x Campaign Spikes!)
# ============================================================
# WHAT IS HPA?
#   This is how Kubernetes handles Northpoint Living's 10x flash-sale
#   campaign spikes!
#
#   It watches average CPU & Memory across all `northpoint-storefront`
#   Pods:
#     - Normal traffic:  Runs minimum 2 Pods
#     - Campaign spike:  CPU > 70% -> Automatically spins up to 50 Pods
#     - After campaign:  Waits 5 minutes (cooldown) -> Scales back to 2 Pods
#
# EQUIVALENT IN TERRAFORM (cloud-run.tf):
#   `scaling { min_instance_count = 2, max_instance_count = 50 }`
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: northpoint-storefront-hpa
  namespace: northpoint-living
spec:
  # Which Deployment should this autoscaler control?
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: northpoint-storefront

  # Minimum and Maximum Pods
  minReplicas: 2    # High Availability baseline (2 Pods across zones)
  maxReplicas: 50   # Cost safety ceiling + handles 10x traffic spike

  # Scaling Triggers
  metrics:
    # Trigger 1: Scale up when average CPU usage across Pods exceeds 70%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Trigger 2: Scale up when average Memory usage exceeds 80%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  # Scaling Behavior (Scale up fast during flash sales, scale down gently)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0   # Scale up immediately when spike hits!
      policies:
        - type: Percent
          value: 100                  # Can double the number of Pods every 15 seconds
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 minutes before scaling down (avoid flapping)
      policies:
        - type: Percent
          value: 25                   # Remove at most 25% of Pods per minute
          periodSeconds: 60

