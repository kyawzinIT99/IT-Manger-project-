# ==============================================================================
# ⚙️ ANSIBLE CONFIGURATION FILE (ansible.cfg)
# ==============================================================================
# When you run `ansible` or `ansible-playbook` inside this `/Ansible` folder,
# Ansible automatically reads this file first!
# ==============================================================================

[defaults]
# 1. Where is our list of servers?
inventory = ./inventory.ini

# 2. Default SSH user created in Dockerfile.node
remote_user = ansible

# 3. Disable SSH host key checking (Critical for Docker containers so you don't
#    get "Are you sure you want to continue connecting (yes/no)?" prompts)
host_key_checking = False

# 4. Store all Ansible execution logs inside this same folder!
log_path = ./test-outputs/ansible-execution.log

# 5. Silence Python interpreter warnings inside containers
interpreter_python = auto_silent

# 6. Show clean, readable output
stdout_callback = default
result_format = yaml

# 7. Automatically unlock Ansible Vault using local key file (ignored by Git!)
vault_password_file = ./ssh-keys/.vault_pass

