# ==============================================================================
# 🐳 DOCKER COMPOSE — 3 UBUNTU SERVERS FOR ANSIBLE LAB
# ==============================================================================
# This file launches 3 isolated Ubuntu Linux servers inside Docker on your MacBook:
#   - server1 (172.28.0.11) -> Mapped to your MacBook port 2221 -> 22
#   - server2 (172.28.0.12) -> Mapped to your MacBook port 2222 -> 22
#   - server3 (172.28.0.13) -> Mapped to your MacBook port 2223 -> 22
#
# Your MacBook is the "Control Node" (Workstation) that connects to all 3 servers
# at once using Ansible over SSH!
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 🖥️ SERVER 1: Web Storefront Node (Port 2221 on MacBook)
  # ----------------------------------------------------------------------------
  server1:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: ansible-server-1
    hostname: northpoint-srv-01
    ports:
      - "2221:22"   # MacBook localhost:2221 -> Container SSH Port 22
    volumes:
      - ./test-outputs/server1:/var/northpoint_backups
    networks:
      ansible_net:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 🖥️ SERVER 2: Application / API Node (Port 2222 on MacBook)
  # ----------------------------------------------------------------------------
  server2:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: ansible-server-2
    hostname: northpoint-srv-02
    ports:
      - "2222:22"   # MacBook localhost:2222 -> Container SSH Port 22
    volumes:
      - ./test-outputs/server2:/var/northpoint_backups
    networks:
      ansible_net:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 🖥️ SERVER 3: Legacy Database & Network Node (Port 2223 on MacBook)
  # ----------------------------------------------------------------------------
  server3:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: ansible-server-3
    hostname: northpoint-srv-03
    ports:
      - "2223:22"   # MacBook localhost:2223 -> Container SSH Port 22
    volumes:
      - ./test-outputs/server3:/var/northpoint_backups
    networks:
      ansible_net:
        ipv4_address: 172.28.0.13
    restart: unless-stopped

# ------------------------------------------------------------------------------
# 🌐 DEDICATED SUBNET (172.28.0.0/16) — CCNA Style Private Lab Network
# ------------------------------------------------------------------------------
networks:
  ansible_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

