# ==============================================================================
# 🐳 DOCKER COMPOSE — 3 UBUNTU SERVERS FOR ANSIBLE LAB
# ==============================================================================
# This file launches 3 isolated Ubuntu Linux servers inside Docker on your MacBook:
#   - server1 (172.28.0.11) -> SSH: 2221->22 | Web HTTP: 8881->80
#   - server2 (172.28.0.12) -> SSH: 2222->22 | Web HTTP: 8882->80
#   - server3 (172.28.0.13) -> SSH: 2223->22 | MySQL DB: 3336->3306
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 🖥️ SERVER 1: Web Storefront Node 1 (IP: 172.28.0.11 | Web: localhost:8881)
  # ----------------------------------------------------------------------------
  server1:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: ansible-server-1
    hostname: northpoint-srv-01
    ports:
      - "2221:22"   # MacBook SSH Port 2221 -> Container Port 22
      - "8881:80"   # MacBook Browser http://localhost:8881 -> Nginx Port 80
    volumes:
      - ./test-outputs/server1:/var/northpoint_backups
    networks:
      ansible_net:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 🖥️ SERVER 2: Web Storefront Node 2 (IP: 172.28.0.12 | Web: localhost:8882)
  # ----------------------------------------------------------------------------
  server2:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: ansible-server-2
    hostname: northpoint-srv-02
    ports:
      - "2222:22"   # MacBook SSH Port 2222 -> Container Port 22
      - "8882:80"   # MacBook Browser http://localhost:8882 -> Nginx Port 80
    volumes:
      - ./test-outputs/server2:/var/northpoint_backups
    networks:
      ansible_net:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 🖥️ SERVER 3: Database + Nginx Load Balancer VIP (IP: 172.28.0.13 | LB: localhost:8880)
  # ----------------------------------------------------------------------------
  server3:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: ansible-server-3
    hostname: northpoint-srv-03
    ports:
      - "2223:22"     # MacBook SSH Port 2223 -> Container Port 22
      - "3336:3306"   # MacBook Port 3336 -> MariaDB/MySQL Port 3306
      - "8880:80"     # MacBook Browser http://localhost:8880 -> Nginx Load Balancer VIP!
    volumes:
      - ./test-outputs/server3:/var/northpoint_backups
    networks:
      ansible_net:
        ipv4_address: 172.28.0.13
    restart: unless-stopped

# ------------------------------------------------------------------------------
# 🌐 DEDICATED SUBNET (172.28.0.0/16) — CCNA Style Private Lab Network
# ------------------------------------------------------------------------------
networks:
  ansible_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
