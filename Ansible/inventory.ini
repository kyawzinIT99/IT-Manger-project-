# ==============================================================================
# 📋 ANSIBLE INVENTORY (inventory.ini)
# ==============================================================================
# What is an Inventory?
# It is Ansible's "Address Book" (like a router host table or /etc/hosts).
# Since all 3 servers run inside Docker on your MacBook (`127.0.0.1`), we
# differentiate them using their mapped SSH ports: 2221, 2222, and 2223!
# ==============================================================================

# ------------------------------------------------------------------------------
# Group 1: Web & App Servers (Server 1 & Server 2)
# ------------------------------------------------------------------------------
[webservers]
server1 ansible_host=127.0.0.1 ansible_port=2221 server_role="Web Storefront Primary" internal_ip="172.28.0.11"
server2 ansible_host=127.0.0.1 ansible_port=2222 server_role="Web Storefront Secondary" internal_ip="172.28.0.12"

# ------------------------------------------------------------------------------
# Group 2: Database & Backup Server (Server 3)
# ------------------------------------------------------------------------------
[dbservers]
server3 ansible_host=127.0.0.1 ansible_port=2223 server_role="Legacy DB & Backup Node" internal_ip="172.28.0.13"

# ------------------------------------------------------------------------------
# Parent Group: "northpoint_servers" (Contains all 3 servers)
# ------------------------------------------------------------------------------
[northpoint_servers:children]
webservers
dbservers

# ------------------------------------------------------------------------------
# Shared Variables for all servers in our Docker Lab
# ------------------------------------------------------------------------------
[northpoint_servers:vars]
ansible_user=ansible
ansible_ssh_pass=northpoint
ansible_become_pass=northpoint
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

