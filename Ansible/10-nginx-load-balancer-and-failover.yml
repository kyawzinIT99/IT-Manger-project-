# ==============================================================================
# 📘 LESSON 10: NGINX REVERSE PROXY LOAD BALANCER & AUTOMATIC FAILOVER
# ==============================================================================
# Run from your MacBook:
#   docker compose up -d
#   ansible-playbook 10-nginx-load-balancer-and-failover.yml
#
# 🎯 Architecture Built by This Playbook:
#
#   🌐 MacBook Browser: http://localhost:8880
#            │
#            ▼
#   ⚖️ LOAD BALANCER VIP (server3 -> 172.28.0.13:80)
#      │     Reads: templates/nginx-load-balancer.conf.j2
#      │
#      ├──► 50% Request 1, 3, 5 ──► 🔵 server1 (172.28.0.11:80) [BLUE THEME]
#      └──► 50% Request 2, 4, 6 ──► 🟣 server2 (172.28.0.12:80) [PURPLE THEME]
# ==============================================================================

---
# ------------------------------------------------------------------------------
# PLAY 1: Update Backend Webservers (`server1` = Blue, `server2` = Purple)
#         so you can visually see Round-Robin flipping when you press Refresh!
# ------------------------------------------------------------------------------
- name: "Lesson 10 (Play 1): Configure Distinct Visual Themes on Backend Webservers"
  hosts: webservers
  become: true

  tasks:
    - name: "1. Deploy Load-Balanced Storefront Page (Blue for Server 1, Purple for Server 2)"
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Northpoint LB -> {{ inventory_hostname }}</title>
            <style>
              body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
              .banner { background: {{ theme_color }}; padding: 30px; border-radius: 14px; max-width: 780px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
              .pill { background: rgba(0,0,0,0.35); padding: 6px 14px; border-radius: 999px; font-weight: bold; font-size: 14px; }
              code { background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 5px; }
            </style>
          </head>
          <body>
            <div class="banner">
              <span class="pill">⚖️ NGINX ROUND-ROBIN LOAD BALANCER LAB</span>
              <h1>🖥️ Answered by: {{ inventory_hostname | upper }} ({{ ansible_facts['hostname'] }})</h1>
              <h2>🏷️ {{ individual_node_title }}</h2>
              <p>🌐 <strong>Backend Server IP:</strong> <code>{{ internal_ip }}:80</code> ({{ assigned_vlan }})</p>
              <p>⚖️ <strong>Load Balancer VIP:</strong> <code>172.28.0.13:80</code> (MacBook: <code>http://localhost:8880</code>)</p>
              <p>🔄 <em>Refresh your browser at <strong>http://localhost:8880</strong> to watch it flip between Server 1 (Blue) and Server 2 (Purple)!</em></p>
            </div>
          </body>
          </html>

    - name: "2. Deploy Compact Text Identity Endpoint (/node-id) for CLI Round-Robin Testing"
      ansible.builtin.copy:
        dest: /var/www/html/node-id
        mode: '0644'
        content: "Answered by {{ inventory_hostname }} ({{ internal_ip }}) - {{ individual_node_title }}"

    - name: "3. Ensure Nginx is running on both Backend Webservers"
      ansible.builtin.service:
        name: nginx
        state: started

# ------------------------------------------------------------------------------
# PLAY 2: Configure Nginx Reverse Proxy Load Balancer on `server3` (172.28.0.13)
# ------------------------------------------------------------------------------
- name: "Lesson 10 (Play 2): Configure Nginx Load Balancer on server3 (172.28.0.13:80)"
  hosts: server3
  become: true

  tasks:
    - name: "1. Install Nginx on server3 (172.28.0.13) to act as Reverse Proxy Load Balancer"
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: "2. Deploy Load Balancer Config from Jinja2 Template (templates/nginx-load-balancer.conf.j2)"
      ansible.builtin.template:
        src: ./templates/nginx-load-balancer.conf.j2
        dest: /etc/nginx/sites-available/default
        mode: '0644'

    - name: "3. Restart Nginx Load Balancer on server3"
      ansible.builtin.service:
        name: nginx
        state: restarted

    - name: "4. Test 6 Consecutive Requests to Load Balancer VIP (172.28.0.13) to Prove 50/50 Round-Robin!"
      ansible.builtin.shell: |
        for i in 1 2 3 4 5 6; do
          echo "Request #$i -> $(curl -s http://172.28.0.13/node-id)"
        done
      register: rr_test_output
      changed_when: false

    - name: "5. Print Live Round-Robin Sequence in Terminal"
      ansible.builtin.debug:
        msg: "{{ rr_test_output.stdout_lines }}"

    - name: "6. Save Load Balancer Test Report to ./test-outputs/server3/"
      ansible.builtin.copy:
        dest: "/var/northpoint_backups/lesson10-load-balancer-test.txt"
        mode: '0644'
        content: |
          ================================================================
          ⚖️ LESSON 10 — NGINX LOAD BALANCER REPORT (VIP: 172.28.0.13:80)
          ================================================================
          Load Balancer VIP : 172.28.0.13:80 (MacBook: http://localhost:8880)
          Backend Pool      : 172.28.0.11:80 (server1) + 172.28.0.12:80 (server2)
          Algorithm         : Round-Robin (50% / 50%) with Automatic Failover

          === 6 CONSECUTIVE REQUESTS TO VIP (http://172.28.0.13/node-id) ===
          {{ rr_test_output.stdout }}
          ================================================================

